const INTERVALS = { 1: 1, 2: 3, 3: 7, 4: 14, 5: 30 };
const DAY = 86400000;
const STORE_KEY = "indo_vocab_v2";

function makeCards(seed) {
  return seed.map((w, i) => ({
    key: "c" + i + "_" + Date.now() + Math.random().toString(36).slice(2, 6),
    id: w.id, ko: w.ko, ex: w.ex || "", exKo: w.exKo || "",
    level: w.level || "BIPA 1",
    box: 0, next: 0, misses: 0,
  }));
}

// localStorage 에서 불러오기 (없으면 기본 단어로 시작)
const DEFAULT_SETTINGS = { dailyCap: 30, newPerDay: 10, newOrder: "recent" };
function loadState() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      const cards = (data.cards || makeCards(SEED)).map((c) => ({ ...c, level: c.level || "BIPA 1", misses: c.misses || 0 }));
      return { cards, dir: data.dir || "id-ko", settings: data.settings || { ...DEFAULT_SETTINGS } };
    }
  } catch (e) { /* 첫 실행 또는 손상된 데이터 */ }
  return { cards: makeCards(SEED), dir: "id-ko", settings: { ...DEFAULT_SETTINGS } };
}

// ── 하루 학습 큐 할당 알고리즘 ──────────────────────────────────
// ① 학습 중 (box 1~3 + 기한 도래) → 전부. 오늘 안 하면 리셋 위험
// ② 새 단어 (box 0) → newPerDay 개. 뇌의 작업기억 한계 고려
// ③ 장기 복습 (box 4~5 + 기한 도래) → 남은 자리 채우기
function buildDailyQueue(cards, settings, now) {
  const { dailyCap, newPerDay, newOrder = "recent" } = settings;
  function sh(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0; [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  // ① 학습 중: box 1~2 (box 3부터는 이미 3번 맞췄으니 여유롭게)
  let learning = cards.filter((c) => isDue(c, now) && c.box >= 1 && c.box <= 2);
  // ③ 여유 복습: box 3~5
  let longTerm = sh(cards.filter((c) => isDue(c, now) && c.box >= 3));

  // 새 단어 정렬
  let newPool = cards.filter((c) => c.box === 0);
  if (newOrder === "recent")  newPool = [...newPool].sort((a, b) => a.key > b.key ? -1 : 1);
  else if (newOrder === "oldest") newPool = [...newPool].sort((a, b) => a.key < b.key ? -1 : 1);
  else if (newOrder === "hard")   newPool = [...newPool].sort((a, b) => (b.misses || 0) - (a.misses || 0) || (a.key > b.key ? -1 : 1));
  else newPool = sh(newPool); // random

  // 어려운 단어 먼저 모드: 학습 중 카드도 misses 기준 정렬
  if (newOrder === "hard") learning = [...learning].sort((a, b) => (b.misses || 0) - (a.misses || 0));
  else learning = sh(learning);

  const queue = [...learning.map((c) => c.key)];
  const taken = new Set(queue);

  // ② 새 단어 (최대 newPerDay)
  let newCount = 0;
  for (const c of newPool) {
    if (newCount >= newPerDay) break;
    queue.push(c.key); taken.add(c.key); newCount++;
  }

  // ③ 여유 복습 — dailyCap까지 채우기
  const ltRoom = Math.max(0, dailyCap - queue.length);
  let ltCount = 0;
  for (const c of longTerm) {
    if (ltCount >= ltRoom) break;
    if (!taken.has(c.key)) { queue.push(c.key); ltCount++; }
  }

  return { keys: queue, nLearning: learning.length, nNew: newCount, nLt: ltCount };
}

function isDue(c, now) { return c.next <= now; }
function bucket(c) {
  if (c.box === 0) return "new";
  if (c.box <= 2) return "learning";   // box 1~2: 아직 학습 중
  return "mastered";                    // box 3~5: 3번 정답 → 학습 완료
}

function App() {

  if (boot.current === null) boot.current = loadState();

  const [view, setView] = useState("home");
  const [dir, setDir] = useState(boot.current.dir);
  const [levelFilter, setLevelFilter] = useState("전체");
  const [settings, setSettings] = useState(boot.current.settings);
  const saveTimer = useRef(null);
  const applyingRemote = useRef(false);

  function applyRemote(d) {
    if (!d) return;
    applyingRemote.current = true;
    if (Array.isArray(d.cards)) setCards(d.cards.map((c) => ({ ...c, level: c.level || "BIPA 1", misses: c.misses || 0 })));
    if (d.dir) setDir(d.dir);
    if (d.settings) setSettings((s) => ({ ...s, ...d.settings }));
  }

  // 앱 시작 시 Firestore 연결 — 로그인 없이 자동 동기화
  useEffect(() => {
    if (!FIREBASE_READY) return;
    const ref = deckRef();
    ref.get().then((snap) => {
      if (snap.exists) applyRemote(snap.data());
      else ref.set({ cards, dir, settings, updatedAt: Date.now() }).catch(() => {});
      ref.onSnapshot((doc) => {
        if (doc.metadata.hasPendingWrites) return;
        applyRemote(doc.data());
      }, () => {});
    }).catch(() => {});
  }, []);

  // 변경 시 저장: 로컬 + 클라우드 자동
  useEffect(() => {
    clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      try { localStorage.setItem(STORE_KEY, JSON.stringify({ cards, dir, settings })); } catch (e) {}
      if (FIREBASE_READY && !applyingRemote.current) {
        deckRef().set({ cards, dir, settings, updatedAt: Date.now() }).catch(() => {});
      }
      applyingRemote.current = false;
    }, 400);
  }, [cards, dir, settings]);

  const levels = ["전체", ...cards.map((c) => c.level).filter((v, i, a) => v && a.indexOf(v) === i)];
  if (levelFilter !== "전체" && !levels.includes(levelFilter)) {
    setLevelFilter("전체");
  }

  const scoped = levelFilter === "전체" ? cards : cards.filter((c) => c.level === levelFilter);
  const now = Date.now();
  const alloc = buildDailyQueue(scoped, settings, now);

  const stats = {
    new: scoped.filter((c) => bucket(c) === "new").length,
    learning: scoped.filter((c) => bucket(c) === "learning").length,
    mastered: scoped.filter((c) => bucket(c) === "mastered").length,
    total: scoped.length,
    alloc, // 오늘 할당량 정보
  };

  const shell = {
    minHeight: "100vh", background: C.cream, color: C.ink,
    fontFamily: "'Hanken Grotesk','Noto Sans KR',sans-serif",
    backgroundImage: `radial-gradient(${C.line} 1px, transparent 1px)`,
    backgroundSize: "22px 22px",
  };

  return (
    <div style={shell}>
      <style>{FONTS}</style>
      <style>{`
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        .fr { font-family:'Fraunces','Noto Sans KR',serif; }
        .pressable { transition: transform .12s ease, box-shadow .12s ease; }
        .pressable:active { transform: scale(.97); }
        @keyframes rise { from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none} }
        .rise { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
        .flip3d { perspective: 1400px; }
        .flipinner { transition: transform .55s cubic-bezier(.4,.2,.2,1); transform-style: preserve-3d; position:relative; }
        .flipped { transform: rotateY(180deg); }
        .face { backface-visibility:hidden; -webkit-backface-visibility:hidden; position:absolute; inset:0; }
        .back { transform: rotateY(180deg); }
      `}</style>

      <div style={{ maxWidth: 460, margin: "0 auto", padding: "20px 18px 64px" }}>
        <Header view={view} setView={setView} />
        {view === "home" && <Home stats={stats} setView={setView} dir={dir} setDir={setDir} levels={levels} levelFilter={levelFilter} setLevelFilter={setLevelFilter} settings={settings} setSettings={setSettings} />}
        {view === "study" && (
          <Study cards={scoped} setCards={setCards} dir={dir} back={() => setView("home")} initialQueue={alloc.keys} />
        )}
        {view === "typing" && (
          <Typing cards={scoped} setCards={setCards} dir={dir} back={() => setView("home")} initialQueue={alloc.keys} />
        )}
        {view === "quiz" && (
          <Quiz cards={scoped} setCards={setCards} dir={dir} back={() => setView("home")} />
        )}
        {view === "manage" && (
          <Manage cards={cards} setCards={setCards} back={() => setView("home")} />
        )}
      </div>
    </div>
  );
}

        <div style={{ fontSize: 13, opacity: .8 }}>오늘 학습할 단어 {levelFilter !== "전체" ? `· ${levelFilter}` : ""}</div>

          {alloc.nLearning > 0 && <span>🔄 학습중 {alloc.nLearning}</span>}
          {alloc.nNew > 0 && <span>✨ 새 단어 {alloc.nNew}</span>}
          {alloc.nLt > 0 && <span>📖 복습 {alloc.nLt}</span>}

        </div>}

function Study({ cards, setCards, dir, back, initialQueue }) {
  const now = Date.now();
  const [queue, setQueue] = useState(() => initialQueue || []);
  const [revealed, setRevealed] = useState(false);
  const [done, setDone] = useState(0);

  if (queue.length === 0) {
    return <DoneScreen count={done} back={back} />;
  }

  const card = cards.find((c) => c.key === queue[0]);
  const front = dir === "id-ko" ? card.id : card.ko;
  const backTxt = dir === "id-ko" ? card.ko : card.id;
  const frontLabel = dir === "id-ko" ? "인도네시아어" : "뜻";

  function rate(kind) {
    const t = Date.now();
    let again = false;
    setCards((prev) => prev.map((c) => {
      if (c.key !== card.key) return c;
      let box = c.box;
      const misses = (c.misses || 0) + (kind === "forgot" ? 1 : 0);
      if (kind === "forgot") {
        // 방향별 오답 페널티: 한국→인니는 리셋, 인니→한국은 한 칸만 강등
        box = dir === "ko-id" ? 1 : Math.max(1, (c.box || 0) - 1);
        again = true;
      } else if (kind === "hard") {
        box = Math.max(1, c.box);
        again = true;
      } else {
        // 방향별 정답 보상: 한국→인니(어려운 방향)는 +2
        const gain = dir === "ko-id" ? 2 : 1;
        box = Math.min(5, (c.box || 0) + gain);
      }
      return { ...c, box, misses, next: t + INTERVALS[box] * DAY };
    }));
    setQueue((q) => {
      const rest = q.slice(1);
      return again ? [...rest, card.key] : rest;
    });
    setRevealed(false);
    setDone((d) => d + 1);
  }

  const total = queue.length;

  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <span style={{ fontSize: 13, color: C.muted }}>남은 카드 {total}개</span>
        <span style={{ fontSize: 12, color: C.muted }}>{dir === "id-ko" ? "인니어 → 뜻" : "뜻 → 인니어 (+2점)"}</span>
        <span style={{ fontSize: 13, color: C.muted }}>오늘 {done}개 학습</span>
      </div>

      <div className="flip3d" style={{ marginBottom: 18 }} onClick={() => !revealed && setRevealed(true)}>
        <div className={"flipinner" + (revealed ? " flipped" : "")} style={{ height: 300 }}>
          <div className="face" style={cardFace(C.paper)}>
            <div style={{ fontSize: 12, color: C.muted, letterSpacing: 1 }}>{frontLabel}</div>
            <div className="fr" style={{ fontSize: dir === "id-ko" ? 40 : 34, fontWeight: 900, color: C.ink, textAlign: "center", padding: "0 10px" }}>
              {front}
            </div>
            <div style={{ fontSize: 13, color: C.clay, fontWeight: 600 }}>👆 떠올린 뒤 눌러서 확인</div>
          </div>
          <div className="face back" style={{ ...cardFace(C.teal), opacity: revealed ? 1 : 0, transition: "opacity .18s ease " + (revealed ? ".16s" : "0s") }}>
            <div className="fr" style={{ fontSize: 38, fontWeight: 900, color: C.cream, textAlign: "center", padding: "0 10px" }}>
              {revealed ? backTxt : ""}
            </div>
            {card.ex ? (
              <div style={{ textAlign: "center", color: "rgba(248,241,228,.85)", fontSize: 14, lineHeight: 1.5, padding: "0 14px" }}>
                <div style={{ fontStyle: "italic" }}>{revealed ? card.ex : ""}</div>
                <div style={{ fontSize: 12.5, opacity: .8, marginTop: 4 }}>{revealed ? card.exKo : ""}</div>
              </div>
            ) : <div style={{ height: 4 }} />}
          </div>
        </div>
      </div>

      {!revealed ? (
        <button onClick={() => setRevealed(true)} className="pressable"
          style={{ width: "100%", padding: 16, borderRadius: 16, border: "none", background: C.ink, color: C.cream, fontSize: 16, fontWeight: 700, cursor: "pointer" }}>
          정답 확인
        </button>
      ) : (
        <div>
          <div style={{ fontSize: 13, color: C.muted, textAlign: "center", marginBottom: 8 }}>얼마나 잘 떠올렸나요?</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
            <RateBtn onClick={() => rate("forgot")} bg="#fff" border={C.red} fg={C.red}>모르겠어요<small>다시 자주</small></RateBtn>
            <RateBtn onClick={() => rate("hard")} bg="#fff" border={C.gold} fg={C.clayDark}>애매해요<small>한 번 더</small></RateBtn>
            <RateBtn onClick={() => rate("easy")} bg={C.green} border={C.green} fg="#fff">알아요!<small>나중에</small></RateBtn>
          </div>
        </div>
      )}
    </div>
  );
}

// ── 주관식 채점 ──────────────────────────────────────────────
function levenshtein(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({ length: m + 1 }, (_, i) =>
    Array.from({ length: n + 1 }, (_, j) => (i === 0 ? j : j === 0 ? i : 0))
  );
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i - 1] === b[j - 1]
        ? dp[i - 1][j - 1]
        : 1 + Math.min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1]);
  return dp[m][n];
}

function normAnswer(s) {
  return s.trim().toLowerCase().replace(/\s+/g, " ").replace(/[.!?~]+$/, "").trim();
}

// "부탁해요 / 도와주세요", "하나 (1)" 처럼 여러 답을 허용하는 뜻도 각각 정답으로 인정
function answerVariants(answer) {
  const stripParen = (s) => s.replace(/\([^)]*\)/g, "");
  const raw = [answer, stripParen(answer), ...answer.split(/[\/,;]/), ...stripParen(answer).split(/[\/,;]/)];
  return [...new Set(raw.map(normAnswer).filter(Boolean))];
}

function grade(input, answer) {
  const a = normAnswer(input);
  const variants = answerVariants(answer);
  if (variants.includes(a)) return "correct";                         // 1단계: 완전 일치
  for (const b of variants) {
    if (a.replace(/\s/g, "") === b.replace(/\s/g, "")) return "ambiguous"; // 띄어쓰기만 다름
    const threshold = Math.max(1, Math.floor(b.length * 0.3));
    if (levenshtein(a, b) <= threshold) return "ambiguous";            // 2단계: 30% 이내 차이
    if (a.length >= 2 && (b.includes(a) || a.includes(b))) return "ambiguous"; // 부분 포함
    if (b.length >= 2 && b.endsWith("다") && a.startsWith(b.slice(0, -1))) return "ambiguous"; // 활용형 (먹다 → 먹어요)
  }
  return "wrong";                                                      // 3단계: 완전 오답
}

// 주관식은 카드 학습과 달리 오답 시 강등
function applyResult(card, result, dir) {
  if (result === "correct") {
    const gain = dir === "ko-id" ? 2 : 1;
    const box = Math.min(5, (card.box || 0) + gain);
    return { box, next: Date.now() + INTERVALS[box] * DAY };
  }
  const box = dir === "ko-id" ? 1 : Math.max(1, (card.box || 0) - 1);
  return { box, misses: (card.misses || 0) + 1, next: Date.now() + INTERVALS[box] * DAY };
}

function Typing({ cards, setCards, dir, back, initialQueue }) {
  const [queue, setQueue] = useState(() => initialQueue || []);
  const [done, setDone] = useState(0);
  const [phase, setPhase] = useState("input"); // "input" | "result" | "ambiguous"
  const [input, setInput] = useState("");
  const [lastGrade, setLastGrade] = useState(null); // "correct" | "wrong"
  const [stats, setStats] = useState({ correct: 0, wrong: 0, demoted: 0 });
  const inputRef = useRef(null);
  const timerRef = useRef(null);
  const busyRef = useRef(false); // 엔터 연타·한글 입력 중 엔터로 두 번 채점되는 것 방지

  const currentKey = queue[0];

  // 카드 넘어갈 때 입력 초기화 + 포커스
  useEffect(() => {
    setInput("");
    setPhase("input");
    setLastGrade(null);
    busyRef.current = false;
    const t = setTimeout(() => inputRef.current && inputRef.current.focus(), 50);
    return () => clearTimeout(t);
  }, [currentKey]);

  useEffect(() => () => clearTimeout(timerRef.current), []);

  // 동기화 등으로 단어가 삭제됐으면 건너뛰기
  useEffect(() => {
    if (currentKey && !cards.some((c) => c.key === currentKey)) setQueue((q) => q.slice(1));
  }, [currentKey, cards]);

  if (queue.length === 0) return <TypingDone stats={stats} back={back} />;

  const card = cards.find((c) => c.key === currentKey);
  if (!card) return null;
  const question = dir === "id-ko" ? card.id : card.ko;
  const answer = dir === "id-ko" ? card.ko : card.id;

  function goNext() {
    clearTimeout(timerRef.current);
    setQueue((q) => (q[0] === card.key ? q.slice(1) : q));
  }

  function confirm() {
    if (busyRef.current || phase !== "input" || !input.trim()) return;
    busyRef.current = true;
    const result = grade(input, answer);
    if (result === "ambiguous") setPhase("ambiguous");
    else applyAndNext(result);
  }

  function applyAndNext(result) {
    const changes = applyResult(card, result, dir);
    setCards((prev) => prev.map((c) => (c.key === card.key ? { ...c, ...changes } : c)));
    setStats((prev) => ({
      correct: prev.correct + (result === "correct" ? 1 : 0),
      wrong: prev.wrong + (result === "wrong" ? 1 : 0),
      demoted: prev.demoted + (result === "wrong" && card.box > 1 ? 1 : 0),
    }));
    setDone((d) => d + 1);
    setLastGrade(result);
    setPhase("result");
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(goNext, 1200);
  }

  function onKeyDown(e) {
    if (e.key !== "Enter") return;
    e.preventDefault();
    if (phase === "input") confirm();
    else if (phase === "result") goNext();
  }

  const ok = lastGrade === "correct";
  const btn = { width: "100%", padding: 15, borderRadius: 16, border: "none", fontSize: 16, fontWeight: 700, cursor: "pointer" };

  return (
    <div style={{ overflowX: "hidden" }}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
        <span style={{ fontSize: 13, color: C.muted }}>남은 {queue.length}개</span>
        <span style={{ fontSize: 12, color: C.muted }}>{dir === "id-ko" ? "인니어 → 뜻" : "뜻 → 인니어 (+2점)"}</span>
        <span style={{ fontSize: 13, color: C.muted }}>오늘 {done}개 완료</span>
      </div>

      <div style={{ background: C.paper, border: `1px solid ${C.line}`, borderRadius: 24, boxShadow: "0 10px 30px rgba(0,0,0,.1)",
        padding: "22px 18px", minHeight: 150, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", gap: 10, marginBottom: 14 }}>
        <div style={{ fontSize: 12, color: C.muted, letterSpacing: 1 }}>{dir === "id-ko" ? "인도네시아어" : "뜻"}</div>
        <div className="fr" style={{ fontSize: dir === "id-ko" ? 38 : 32, fontWeight: 900, color: C.ink, textAlign: "center", wordBreak: "keep-all", overflowWrap: "anywhere" }}>
          {question}
        </div>
      </div>

      <input ref={inputRef} value={input} onChange={(e) => phase === "input" && setInput(e.target.value)} onKeyDown={onKeyDown}
        readOnly={phase !== "input"}
        autoComplete="off" autoCorrect="off" autoCapitalize="off" spellCheck={false} enterKeyHint="done"
        placeholder={dir === "id-ko" ? "뜻을 한국어로 입력하세요" : "인도네시아어로 입력하세요"}
        style={{ width: "100%", padding: "14px 16px", borderRadius: 14, border: `1.5px solid ${C.line}`, background: C.paper,
          fontSize: 17, color: C.ink, fontFamily: "inherit", marginBottom: 12, outline: "none" }} />

      {phase === "input" && (
        <button onClick={confirm} disabled={!input.trim()} className="pressable"
          style={{ ...btn, background: input.trim() ? C.ink : C.line, color: input.trim() ? C.cream : C.muted, cursor: input.trim() ? "pointer" : "default" }}>
          확인
        </button>
      )}

      {phase === "ambiguous" && (
        <div className="rise" style={{ background: C.paper, border: `1.5px solid ${C.gold}`, borderRadius: 18, padding: 16 }}>
          <div style={{ fontSize: 16, fontWeight: 700, color: C.clayDark, marginBottom: 10 }}>🤔 비슷한데... 확인해보세요</div>
          <AnswerLine label="정답" value={answer} strong />
          <AnswerLine label="내 답" value={input} />
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginTop: 14 }}>
            <button onClick={() => applyAndNext("correct")} className="pressable" style={{ ...btn, background: C.green, color: "#fff" }}>✅ 맞아요</button>
            <button onClick={() => applyAndNext("wrong")} className="pressable" style={{ ...btn, background: "#fff", color: C.red, border: `1.5px solid ${C.red}` }}>❌ 틀려요</button>
          </div>
        </div>
      )}

      {phase === "result" && (
        <div className="rise" style={{ background: ok ? "#E6F2EC" : "#F4DAD2", border: `1.5px solid ${ok ? C.green : C.red}`, borderRadius: 18, padding: 16 }}>
          <div style={{ fontSize: 18, fontWeight: 800, color: ok ? C.green : C.clayDark, marginBottom: 10 }}>{ok ? "✅ 정답!" : "❌ 오답"}</div>
          <AnswerLine label="정답" value={answer} strong />
          <AnswerLine label="내 답" value={input} />
          {!ok && <div style={{ fontSize: 12, color: C.muted, marginTop: 6 }}>지금까지 {card.misses || 0}번 틀렸어요</div>}
          {card.ex && <div style={{ fontSize: 13, color: C.muted, marginTop: 8, fontStyle: "italic" }}>{card.ex}</div>}
          <button onClick={goNext} className="pressable" style={{ ...btn, marginTop: 14, background: C.ink, color: C.cream }}>다음 →</button>
        </div>
      )}
    </div>
  );
}

function TypingDone({ stats, back }) {

      <button onClick={back} className="pressable"

function makeOptions(cards, card, ans, dir) {
  if (!card) return [];
  const others = cards.filter((c) => c.key !== card.key).map((c) => (dir === "id-ko" ? c.ko : c.id));
  const uniq = [...new Set(others)].filter((o) => o !== ans);
  for (let i = uniq.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0;[uniq[i], uniq[j]] = [uniq[j], uniq[i]]; }
  const opts = [ans, ...uniq.slice(0, 3)];
  for (let i = opts.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0;[opts[i], opts[j]] = [opts[j], opts[i]]; }
  return opts;
}

function Quiz({ cards, setCards, dir, back }) {
  const [order] = useState(() => {
    const due = cards.filter((c) => isDue(c, Date.now()));
    const base = (due.length >= 4 ? due : cards).slice();
    for (let i = base.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0;[base[i], base[j]] = [base[j], base[i]]; }
    return base.slice(0, 10).map((c) => c.key);
  });
  const [idx, setIdx] = useState(0);
  const [picked, setPicked] = useState(null);
  const [score, setScore] = useState(0);
  const [wrongList, setWrongList] = useState([]);

  const card = idx < order.length ? cards.find((c) => c.key === order[idx]) : null;
  const ans = card ? (dir === "id-ko" ? card.ko : card.id) : null;
  // 보기는 문제(idx)가 바뀔 때만 새로 만든다.
  // (setCards 로 card 객체가 새로 만들어져도 보기가 다시 섞이지 않도록)
  // 같은 렌더 안에서 바로 계산해서, 다음 문제로 넘어갈 때 이전 보기가 깜빡이지 않게 함
  const [optState, setOptState] = useState(() => ({ idx, opts: makeOptions(cards, card, ans, dir) }));
  let options = optState.opts;
  if (optState.idx !== idx) {
    options = makeOptions(cards, card, ans, dir);
    setOptState({ idx, opts: options });
  }

  if (cards.length < 4) {
    return <div style={{ textAlign: "center", padding: 30, color: C.muted }}>퀴즈는 단어가 4개 이상일 때 가능해요.</div>;
  }
  if (idx >= order.length) {
    return (
      <div className="rise" style={{ textAlign: "center", padding: "40px 20px" }}>
        <div style={{ fontSize: 52 }}>{score === order.length ? "🏆" : "📘"}</div>
        <div className="fr" style={{ fontSize: 26, fontWeight: 900, color: C.teal, margin: "10px 0" }}>
          {order.length}문제 중 {score}개 정답
        </div>
        {wrongList.length > 0 && (
          <div style={{ textAlign: "left", marginTop: 18 }}>
            <div style={{ fontSize: 14, fontWeight: 700, color: C.clayDark, marginBottom: 8 }}>❌ 틀린 단어 ({wrongList.length}개)</div>
            <div style={{ background: C.paper, border: `1px solid ${C.line}`, borderRadius: 16, padding: "4px 14px" }}>
              {wrongList.map((w, i) => (
                <div key={i} style={{ display: "flex", justifyContent: "space-between", gap: 12, padding: "10px 0", borderTop: i ? `1px solid ${C.line}` : "none" }}>
                  <span className="fr" style={{ fontWeight: 700, color: C.ink }}>{w.id}</span>
                  <span style={{ color: C.muted, textAlign: "right" }}>{w.ko}</span>
                </div>
              ))}
            </div>
          </div>
        )}
        <button onClick={back} className="pressable" style={{ padding: "14px 28px", borderRadius: 16, border: "none", background: C.clay, color: "#fff", fontWeight: 700, cursor: "pointer", marginTop: 14 }}>홈으로</button>
      </div>
    );
  }

  const q = dir === "id-ko" ? card.id : card.ko;

  function choose(opt) {
    if (picked) return;
    setPicked(opt);
    const correct = opt === ans;
    if (correct) setScore((s) => s + 1);
    else setWrongList((prev) => [...prev, { id: card.id, ko: card.ko }]);
    setCards((prev) => prev.map((c) => {
      if (c.key !== card.key) return c;
      const box = correct ? Math.min(5, (c.box || 0) + 1) : 1;
      return { ...c, box, next: Date.now() + INTERVALS[box] * DAY };
    }));
    setTimeout(() => { setPicked(null); setIdx((i) => i + 1); }, 950);
  }

  return (
    <div>
      <div style={{ fontSize: 13, color: C.muted, marginBottom: 12 }}>문제 {idx + 1} / {order.length}</div>
      <div style={{ background: C.teal, color: C.cream, borderRadius: 22, padding: "30px 18px", textAlign: "center", marginBottom: 18, boxShadow: "0 8px 24px rgba(24,92,88,.18)" }}>
        <div style={{ fontSize: 12, opacity: .7, marginBottom: 6 }}>{dir === "id-ko" ? "뜻을 고르세요" : "맞는 인도네시아어를 고르세요"}</div>
        <div className="fr" style={{ fontSize: 34, fontWeight: 900 }}>{q}</div>
      </div>
      <div style={{ display: "grid", gap: 10 }}>
        {options.map((opt) => {
          let bg = C.paper, bd = C.line, fg = C.ink;
          if (picked) {
            if (opt === ans) { bg = C.green; bd = C.green; fg = "#fff"; }
            else if (opt === picked) { bg = "#F4DAD2"; bd = C.red; fg = C.clayDark; }
          }
          return (
            <button key={opt} onClick={() => choose(opt)} className="pressable"
              style={{ padding: "16px 18px", borderRadius: 16, border: `1.5px solid ${bd}`, background: bg, color: fg, fontSize: 16, fontWeight: 600, textAlign: "left", cursor: "pointer" }}>
              {opt}
            </button>
          );
        })}
      </div>
    </div>
  );
}

function LevelChips({ existingLevels, value, onPick, inputRef }) {
  const opts = ["미지정", ...existingLevels.filter((l) => l && l !== "미지정")];
  return (
    <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 8 }}>
      {opts.map((lv) => (
        <button key={lv} onClick={() => onPick(lv)} className="pressable"
          style={{ padding: "5px 11px", borderRadius: 999, fontSize: 12, cursor: "pointer",
            border: `1px solid ${value === lv ? C.teal : C.line}`,
            background: value === lv ? C.teal : "transparent", color: value === lv ? "#fff" : C.muted }}>
          {lv}
        </button>
      ))}
      <button onClick={() => { onPick(""); setTimeout(() => { if (inputRef && inputRef.current) inputRef.current.focus(); }, 0); }} className="pressable"
        style={{ padding: "5px 11px", borderRadius: 999, fontSize: 12, cursor: "pointer",
          border: `1px dashed ${C.clay}`, background: "transparent", color: C.clay, fontWeight: 600 }}>
        + 새 카테고리
      </button>
    </div>
  );
}

function Manage({ cards, setCards, back }) {
  const [tab, setTab] = useState("one");
  const [id, setId] = useState("");
  const [ko, setKo] = useState("");
  const [ex, setEx] = useState("");
  const [level, setLevel] = useState("미지정");
  const [bulk, setBulk] = useState("");
  const [bulkLevel, setBulkLevel] = useState("미지정");
  const [bulkMsg, setBulkMsg] = useState("");
  const [exportText, setExportText] = useState(null);
  const [copyMsg, setCopyMsg] = useState("");
  const [progressFilter, setProgressFilter] = useState("all");
  const [manageSort, setManageSort] = useState("recent");
  const levelRef = useRef(null);
  const bulkLevelRef = useRef(null);

  const [dupMsg, setDupMsg] = useState("");

  const existingLevels = cards.map((c) => c.level).filter((v, i, a) => v && a.indexOf(v) === i);
  const existingWords = new Set(cards.map((c) => c.id.trim().toLowerCase()));

  function add() {
    if (!id.trim() || !ko.trim()) return;
    if (existingWords.has(id.trim().toLowerCase())) {
      setDupMsg(`"${id.trim()}"는 이미 있는 단어예요.`);
      return;
    }
    setDupMsg("");
    const card = {
      key: "u" + Date.now() + Math.random().toString(36).slice(2, 6),
      id: id.trim(), ko: ko.trim(), ex: ex.trim(), exKo: "",
      level: level.trim() || "미지정", box: 0, next: 0,
    };
    setCards((prev) => [card, ...prev]);
    setId(""); setKo(""); setEx("");
  }
  function remove(key) { setCards((prev) => prev.filter((c) => c.key !== key)); }
  function resetCard(key) {
    setCards((prev) => prev.map((c) => (c.key === key ? { ...c, box: 0, next: 0, misses: 0 } : c)));
  }
  function changeLevel(key, newLevel) {
    setCards((prev) => prev.map((c) => (c.key === key ? { ...c, level: newLevel } : c)));
  }

  function addBulk() {
    const lines = bulk.split("\n").map((l) => l.trim()).filter(Boolean);
    const newCards = [];
    let skipped = 0, duped = 0;
    const lv = bulkLevel.trim() || "미지정";
    const seen = new Set(existingWords);
    for (const line of lines) {
      const parts = line.split(/\t|,|;/).map((p) => p.trim());
      const [w, meaning, example] = parts;
      if (!w || !meaning) { skipped++; continue; }
      if (seen.has(w.toLowerCase())) { duped++; continue; }
      seen.add(w.toLowerCase());
      newCards.push({
        key: "u" + Date.now() + Math.random().toString(36).slice(2, 7),
        id: w, ko: meaning, ex: example || "", exKo: "", level: lv, box: 0, next: 0,
      });
    }
    if (newCards.length === 0) {
      setBulkMsg(duped > 0 ? `모두 이미 있는 단어예요. (중복 ${duped}개)` : "등록할 단어를 찾지 못했어요. '인니어, 뜻' 형식인지 확인해 주세요.");
      return;
    }
    setCards((prev) => [...newCards, ...prev]);
    setBulk("");
    const msgs = [`${lv}에 ${newCards.length}개 추가 완료!`];
    if (duped > 0) msgs.push(`중복 ${duped}개 건너뜀`);
    if (skipped > 0) msgs.push(`형식 오류 ${skipped}줄 건너뜀`);
    setBulkMsg(msgs.join(" · "));
  }

  function reset() {
    if (confirm("모든 단어의 학습 진도를 초기화할까요? (단어는 그대로 남습니다)")) {
      setCards((prev) => prev.map((c) => ({ ...c, box: 0, next: 0 })));
    }
  }

  function doExport() {
    const byLevel = {};
    for (const c of cards) { (byLevel[c.level] = byLevel[c.level] || []).push(c); }
    let out = "";
    for (const lv of Object.keys(byLevel)) {
      out += `[${lv}]\n`;
      for (const c of byLevel[lv]) out += `${c.id}, ${c.ko}${c.ex ? `, ${c.ex}` : ""}\n`;
      out += "\n";
    }
    setExportText(out.trim());
    setCopyMsg("");
  }
  async function copyExport() {
    try {
      await navigator.clipboard.writeText(exportText);
      setCopyMsg("복사됐어요!");
    } catch (e) {
      setCopyMsg("아래 글을 길게 눌러 직접 복사해 주세요.");
    }
  }

  const input = { width: "100%", padding: "12px 14px", borderRadius: 12, border: `1px solid ${C.line}`, background: C.paper, fontSize: 15, color: C.ink, marginBottom: 8, fontFamily: "inherit" };

  // 레벨 이름은 전체 단어 기준 (레벨 변경 드롭다운용)
  const allLevelNames = cards.map((c) => c.level).filter((v, i, a) => v && a.indexOf(v) === i);

  // 진도 필터 + 정렬
  const displayCards = cards
    .filter((c) => {
      if (progressFilter === "new") return c.box === 0;
      if (progressFilter === "learning") return c.box >= 1 && c.box <= 2;
      if (progressFilter === "mastered") return c.box >= 3;
      return true;
    })
    .sort((a, b) => {
      if (manageSort === "alpha") return a.id.localeCompare(b.id);
      if (manageSort === "hard") return (b.misses || 0) - (a.misses || 0);
      return 0; // 최근 추가순: 새 단어는 배열 앞에 추가되므로 원래 순서 유지
    });

  const grouped = {};
  for (const c of displayCards) { (grouped[c.level] = grouped[c.level] || []).push(c); }
  const shownLevelNames = Object.keys(grouped);

  const chip = (active) => ({
    flexShrink: 0, padding: "6px 12px", borderRadius: 999, fontSize: 12, cursor: "pointer", whiteSpace: "nowrap",
    border: `1px solid ${active ? C.teal : C.line}`, background: active ? C.teal : C.paper,
    color: active ? "#fff" : C.muted, fontWeight: active ? 700 : 500,
  });
  const FILTERS = [["all", "전체"], ["new", "새 단어"], ["learning", "학습 중"], ["mastered", "학습 완료"]];
  const SORTS = [["recent", "최근 추가순"], ["alpha", "가나다순"], ["hard", "어려운 순"]];

  return (
    <div>
      <div style={{ background: C.paper, border: `1px solid ${C.line}`, borderRadius: 18, padding: 16, marginBottom: 18 }}>
        <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
          <Toggle active={tab === "one"} onClick={() => { setTab("one"); setBulkMsg(""); }}>한 개씩 추가</Toggle>
          <Toggle active={tab === "bulk"} onClick={() => { setTab("bulk"); setBulkMsg(""); }}>여러 개 한꺼번에</Toggle>
        </div>

        {tab === "one" ? (
          <>
            <input style={input} placeholder="인도네시아어 (예: terima kasih) *필수" value={id} onChange={(e) => setId(e.target.value)} />
            <input style={input} placeholder="뜻 (예: 감사합니다) *필수" value={ko} onChange={(e) => setKo(e.target.value)} />
            <input style={input} placeholder="예문 (선택)" value={ex} onChange={(e) => setEx(e.target.value)} />
            <div style={{ fontSize: 12, color: C.muted, margin: "2px 0 6px" }}>레벨 · 카테고리 <span style={{ opacity: .7 }}>(직접 입력하면 새로 만들어져요)</span></div>
            <LevelChips existingLevels={existingLevels} value={level} onPick={setLevel} inputRef={levelRef} />
            <input ref={levelRef} style={input} placeholder="예: BIPA 1 / 미지정 / 음식" value={level} onChange={(e) => setLevel(e.target.value)} />
            <button onClick={add} disabled={!id.trim() || !ko.trim()} className="pressable"
              style={{ width: "100%", padding: 13, borderRadius: 12, border: "none",
                background: (!id.trim() || !ko.trim()) ? C.line : C.clay,
                color: (!id.trim() || !ko.trim()) ? C.muted : "#fff",
                fontWeight: 700, fontSize: 15, cursor: (!id.trim() || !ko.trim()) ? "default" : "pointer" }}>
              {(!id.trim() || !ko.trim()) ? "인도네시아어와 뜻을 입력해주세요" : "추가하기"}
            </button>
            {dupMsg && <div style={{ fontSize: 12.5, color: C.red, marginTop: 6, textAlign: "center" }}>{dupMsg}</div>}
          </>
        ) : (
          <>
            <div style={{ fontSize: 12.5, color: C.muted, lineHeight: 1.6, marginBottom: 8 }}>
              한 줄에 한 단어씩 붙여넣으세요. <b style={{ color: C.ink }}>인니어, 뜻</b> 순서이며 쉼표(,)·탭·세미콜론(;) 어느 것으로 구분해도 됩니다. 엑셀·한글에서 두 열을 복사해 붙여도 돼요. 아래에서 고른 레벨로 한꺼번에 등록됩니다.
            </div>
            <textarea value={bulk} onChange={(e) => setBulk(e.target.value)} rows={7}
              placeholder={"makan, 먹다\nminum, 마시다\nbesar, 크다, Rumah ini besar."}
              style={{ ...input, resize: "vertical", lineHeight: 1.5, marginBottom: 8 }} />
            <div style={{ fontSize: 12, color: C.muted, marginBottom: 6 }}>이 묶음의 레벨 · 카테고리 <span style={{ opacity: .7 }}>(직접 입력하면 새로 만들어져요)</span></div>
            <LevelChips existingLevels={existingLevels} value={bulkLevel} onPick={setBulkLevel} inputRef={bulkLevelRef} />
            <input ref={bulkLevelRef} style={input} placeholder="예: BIPA 2 / 미지정 / 여행" value={bulkLevel} onChange={(e) => setBulkLevel(e.target.value)} />
            {bulkMsg && <div style={{ fontSize: 12.5, color: bulkMsg.includes("완료") ? C.green : C.clay, marginBottom: 8, fontWeight: 600 }}>{bulkMsg}</div>}
            <button onClick={addBulk} className="pressable"
              style={{ width: "100%", padding: 13, borderRadius: 12, border: "none", background: C.clay, color: "#fff", fontWeight: 700, fontSize: 15, cursor: "pointer" }}>
              한꺼번에 등록하기
            </button>
          </>
        )}
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 12 }}>
        <div style={{ fontSize: 13, color: C.muted }}>전체 {cards.length}개 · {allLevelNames.length}개 레벨</div>
        <div style={{ display: "flex", gap: 14 }}>
          <button onClick={doExport} style={{ fontSize: 12.5, color: C.teal, background: "none", border: "none", cursor: "pointer", textDecoration: "underline" }}>내보내기</button>
          <button onClick={reset} style={{ fontSize: 12.5, color: C.clay, background: "none", border: "none", cursor: "pointer", textDecoration: "underline" }}>진도 초기화</button>
        </div>
      </div>

      {exportText !== null && (
        <div style={{ background: C.paper, border: `1px solid ${C.line}`, borderRadius: 16, padding: 14, marginBottom: 18 }}>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
            <div style={{ fontSize: 13, fontWeight: 700 }}>단어 목록 내보내기</div>
            <button onClick={() => setExportText(null)} style={{ background: "none", border: "none", color: C.muted, fontSize: 16, cursor: "pointer" }}>✕</button>
          </div>
          <textarea readOnly value={exportText} rows={8} onFocus={(e) => e.target.select()}
            style={{ ...input, marginBottom: 8, fontSize: 13, lineHeight: 1.5, fontFamily: "monospace" }} />
          <button onClick={copyExport} className="pressable"
            style={{ width: "100%", padding: 11, borderRadius: 10, border: `1px solid ${C.teal}`, background: C.teal, color: "#fff", fontWeight: 700, fontSize: 14, cursor: "pointer" }}>
            복사하기
          </button>
          {copyMsg && <div style={{ fontSize: 12.5, color: C.green, marginTop: 6, textAlign: "center" }}>{copyMsg}</div>}
        </div>
      )}

      <div style={{ marginBottom: 14 }}>
        <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 6 }}>
          {FILTERS.map(([k, label]) => (
            <button key={k} onClick={() => setProgressFilter(k)} className="pressable" style={chip(progressFilter === k)}>{label}</button>
          ))}
        </div>
        <div style={{ display: "flex", gap: 6, overflowX: "auto", paddingBottom: 4 }}>
          {SORTS.map(([k, label]) => (
            <button key={k} onClick={() => setManageSort(k)} className="pressable" style={chip(manageSort === k)}>{label}</button>
          ))}
        </div>
        {progressFilter !== "all" && (
          <div style={{ fontSize: 12, color: C.muted, marginTop: 6 }}>{displayCards.length}개 표시 중</div>
        )}
      </div>

      {displayCards.length === 0 && (
        <div style={{ textAlign: "center", color: C.muted, fontSize: 13, padding: "20px 0" }}>해당하는 단어가 없어요.</div>
      )}

      {shownLevelNames.map((lv) => (
        <div key={lv} style={{ marginBottom: 18 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
            <div className="fr" style={{ fontWeight: 900, fontSize: 16, color: C.teal }}>{lv}</div>
            <div style={{ fontSize: 12, color: C.muted }}>{grouped[lv].length}개</div>
            <div style={{ flex: 1, height: 1, background: C.line }} />
          </div>
          <div style={{ display: "grid", gap: 8 }}>
            {grouped[lv].map((c) => (
              <div key={c.key} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", background: C.paper, border: `1px solid ${C.line}`, borderRadius: 14, padding: "11px 14px" }}>
                <div style={{ minWidth: 0 }}>
                  <div className="fr" style={{ fontWeight: 700, fontSize: 16 }}>{c.id}</div>
                  <div style={{ fontSize: 13, color: C.muted, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{c.ko}</div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 10, flexShrink: 0 }}>
                  {allLevelNames.length > 1 && (
                    <select value={c.level} onChange={(e) => changeLevel(c.key, e.target.value)}
                      style={{ fontSize: 11, color: C.muted, border: `1px solid ${C.line}`, borderRadius: 8, padding: "3px 4px", background: C.cream, fontFamily: "inherit" }}>
                      {[...new Set([...allLevelNames, "미지정"])].map((n) => <option key={n} value={n}>{n}</option>)}
                    </select>
                  )}
                  <BoxPip box={c.box} misses={c.misses} />
                  <button onClick={() => resetCard(c.key)} title="이 단어 진도 초기화"
                    style={{ background: "none", border: "none", color: C.muted, fontSize: 13, cursor: "pointer", padding: 4, opacity: 0.6 }}>
                    🔄
                  </button>
                  <button onClick={() => remove(c.key)} style={{ background: "none", border: "none", color: C.muted, fontSize: 18, cursor: "pointer", padding: 4 }}>✕</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

function BoxPip({ box, misses }) {
  const filled = Math.min(3, box); // box 3 이상은 모두 3개 꽉 참 = 학습 완료
  const dotColor = [C.line, "#E6B9A8", C.gold, C.green][filled];
  return (
    <div style={{ display: "flex", gap: 4, alignItems: "center" }} title={`${filled}/3${misses ? ` · 틀린 횟수 ${misses}` : ""}`}>
      {[1, 2, 3].map((n) => (
        <div key={n} style={{ width: 8, height: 8, borderRadius: 99, background: n <= filled ? dotColor : C.line }} />
      ))}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("/sw.js").catch(() => {});
      });
    }
  </script>
